version: 2

updates:
  - package-ecosystem: cargo
    directory: /src-tauri
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Paris
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - rust
    commit-message:
      prefix: "chore(deps-rust)"
    # 2026-08-17: this job failed wholesale — all five candidate updates
    # (thiserror, zbus, futures, rusqlite, ctap-hid-fido2) came back
    # `dependency_file_not_resolvable`, every one of them on the same root
    # message: "failed to select a version for the requirement
    # `cpufeatures = ^0.3` (locked to 0.3.0) — candidate versions found
    # which didn't match: 0.2.17, 0.2.16, ...".
    #
    # The repository was not at fault, and it is worth not re-deriving this:
    # cpufeatures 0.3.0 is neither yanked nor missing (published 2026-02-05,
    # still the crate's default version), aes 0.9.1 likewise (2026-05-27),
    # and both have sat in Cargo.lock since 4cc9aa7 (2026-05-09) — content
    # this very job resolved successfully every Monday through 2026-08-10.
    # It does not reproduce locally on cargo 1.96, nor under a real 1.84
    # toolchain, nor with `rust-version` forced down to 1.80, so it is not
    # MSRV-aware resolution either. Only 0.2.x candidates being visible means
    # the updater's index view lacked 0.3.0 — its proxy reported 79% cached
    # calls that run. In short: a stale index cache on Dependabot's side.
    #
    # Editing this file makes Dependabot re-check the ecosystem, which is
    # how the failure above was retried. If it ever comes back with the same
    # message, do NOT edit Cargo.lock or chase the crate — confirm against
    # crates.io first, then retry. Rust health while the bot is down is
    # checked by hand with `cargo audit` (clean at the time of writing).
    # Ignore semver-major bumps for crates that depend on the same
    # `digest 0.10` / `rand_core 0.6` slice as `rsa 0.9` (our stable).
    # Bumping any one of them breaks the other six because `rsa` still
    # carries the old traits. Lift these entries the moment `rsa 0.10`
    # ships stable on crates.io — Dependabot will then re-open all the
    # major bumps as one coherent group via the `rust-crypto` group
    # below. Past blocked attempts: PR #31 (group bump), PR #35 (rand).
    #
    # `tauri*` is fully ignored: tauri-action's smoke E2E rejects the
    # build when the Cargo `tauri` and npm `@tauri-apps/*` versions
    # drift on major/minor, and Dependabot can't bump both ecosystems
    # atomically without losing the per-ecosystem groups (a single
    # update entry can't be both grouped and split via
    # multi-ecosystem-group, and two entries on the same ecosystem +
    # directory + target-branch is rejected by Dependabot). Tauri
    # bumps are reviewed manually so cargo and npm move together.
    # Past blocked attempts: PR #54 (tauri group), PR #56 (tauri 2.11.1).
    ignore:
      - dependency-name: rand
        update-types: ["version-update:semver-major"]
      - dependency-name: sha2
        update-types: ["version-update:semver-major"]
      - dependency-name: sha1
        update-types: ["version-update:semver-major"]
      - dependency-name: hmac
        update-types: ["version-update:semver-major"]
      - dependency-name: hkdf
        update-types: ["version-update:semver-major"]
      - dependency-name: pbkdf2
        update-types: ["version-update:semver-major"]
      - dependency-name: aes
        update-types: ["version-update:semver-major"]
      - dependency-name: cbc
        update-types: ["version-update:semver-major"]
      - dependency-name: "tauri*"
    groups:
      rust-crypto:
        patterns:
          - aes
          - cbc
          - hmac
          - hkdf
          - pbkdf2
          - argon2
          - rsa
          - sha1
          - sha2
      rust-core:
        patterns:
          - serde*
          - thiserror
          - reqwest
          - tokio*
          - url
          - uuid

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Paris
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - javascript
    commit-message:
      prefix: "chore(deps-npm)"
    # Ignore semver-major bumps for `@wdio/*`: the runtime plugin
    # loader rejects mismatched majors across the cli / local-runner /
    # mocha-framework / spec-reporter set, so a single-package major
    # always lands E2E red. Past blocked attempt: PR #43 (mocha-framework
    # 7→9 alone). When we choose to upgrade the whole family, lift this
    # entry and let the `wdio` group below batch the bump.
    #
    # `@wdio/mocha-framework` is pinned EXACTLY in package.json (no
    # caret), which is deliberate and must survive future edits.
    # 9.31.6 declares `mocha: ^10.3.0`; 9.31.7 declares `mocha: ^11.8.0`
    # — a patch release that crosses a major. Taking 9.31.7 pulls mocha
    # 11.8.0, which brings `diff@7.0.0`, inside the vulnerable range of
    # GHSA-73rr-hh4g-fpgx (jsdiff DoS, >=6.0.0 <8.0.3). We resolve
    # `diff@5.2.2`, below the range, so the bump would *introduce* an
    # advisory and red the `pnpm audit (full tree)` gate.
    #
    # A caret cannot express that constraint — `^9.31.2` and `^9.31.6`
    # both admit 9.31.7 — so only the lockfile was holding mocha at 10,
    # and any fresh resolution (rebase, batch, bare `pnpm install`)
    # would silently take it. The exact pin makes the spec say what the
    # lockfile does. Dependabot will keep proposing bumps past it, which
    # is the point: each one becomes a deliberate decision.
    #
    # Lift the pin when mocha 10 -> 11 is done properly in its own PR,
    # with the E2E suite exercised against it — including a deliberately
    # failing test, since the assertion diff is the only code path
    # jsdiff is on, so a green run proves nothing. A scoped
    # `diff@>=6.0.0 <8.0.3: ^8.0.3` floor then clears the advisory.
    # Past blocked attempts: PR #302, PR #309.
    #
    # `@tauri-apps/*` is mirrored to the cargo `tauri*` ignore — see
    # the comment on that block. The two ecosystems must move
    # together, so we manage Tauri bumps by hand. Past blocked
    # attempt: PR #53 (tauri-npm group).
    ignore:
      - dependency-name: "@wdio/*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@tauri-apps/*"
    groups:
      svelte:
        patterns:
          - svelte*
          - "@sveltejs/*"
      paraglide:
        patterns:
          - "@inlang/*"
      wdio:
        patterns:
          - "@wdio/*"
          - webdriverio

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Paris
    open-pull-requests-limit: 3
    labels:
      - dependencies
      - ci
    commit-message:
      prefix: "chore(deps-ci)"
