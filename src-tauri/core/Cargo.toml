[package]
name = "clavix-core"
# Deliberately not versioned in step with the app: nothing consumes this
# crate by version, and leaving it at 0.0.0 keeps release-please's
# `src-tauri/Cargo.toml` bump the only version edit a release makes.
version = "0.0.0"
description = "Vault engine for Clavix: Bitwarden/Vaultwarden protocol, crypto and vault logic, free of any UI toolkit"
authors = ["Clavix Labs"]
license = "GPL-3.0-or-later"
edition = "2021"
publish = false

[lib]
name = "clavix_core"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_repr = "0.1"
# Generates the TypeScript types the WebView consumes, straight from the
# Rust definitions, serde attributes included. Hand-written mirrors had
# silently drifted: `webauthn_challenge` shipped in snake_case while the
# frontend read `webauthnChallenge`, so WebAuthn 2FA could never work.
ts-rs = "12"
thiserror = "2"
url = "2"
# `multipart` is for attachment upload: Vaultwarden's direct-upload
# endpoint takes multipart/form-data and nothing else.
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "gzip", "multipart"] }
pbkdf2 = "0.12"
sha2 = "0.10"
argon2 = "0.6"
# 0.23 turned on SIMD engines by default, which flips the crate from
# `forbid(unsafe_code)` to `deny` and compiles hand-written AVX2/NEON
# intrinsics into a binary that handles vault keys. We only ever use the
# scalar `general_purpose` engines, so drop the default features and keep
# the unsafe code out of the tree.
base64 = { version = "0.23", default-features = false, features = ["std"] }
zeroize = { version = "1", features = ["derive"] }
secrecy = "0.10"
uuid = { version = "1", features = ["v4"] }
aes = "0.8"
cbc = { version = "0.1", features = ["alloc"] }
hmac = "0.12"
hkdf = "0.12"
rsa = "0.9"
sha1 = "0.10"
dirs = "6"
rand = "0.8"
rusqlite = { version = "0.40", features = ["bundled"] }
parking_lot = "0.12"
rayon = "1"
futures = "0.3"
zxcvbn = { version = "3", default-features = false }

[dev-dependencies]
# Property-based tests on adversarial-input parsers — currently EncString
# (Bitwarden ciphertext format). The point is to fuzz inputs the server
# can choose freely: they must never panic and never accept a malformed
# value.
proptest = { version = "1", default-features = false, features = ["std"] }
# Mock HTTP server for the tests that exercise the Vaultwarden client
# without booting a real container.
mockito = "1"
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt"] }
